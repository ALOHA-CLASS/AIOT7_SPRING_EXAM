<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>할일 등록/수정</title>
  <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
  <main>
    <h1 th:text="${todo.no == null} ? '할일 등록' : '할일 수정'">할일 등록</h1>

    <form th:action="${todo.no == null} ? @{/todos} : @{/todos/{no}(no=${todo.no})}" method="post" class="form">
      <label>제목
        <input type="text" name="title" th:value="${todo.title}" maxlength="100" required>
      </label>
      <label>내용
        <textarea name="content" rows="4" th:text="${todo.content}"></textarea>
      </label>
      <label>상태
        <select name="status">
          <option th:each="s : ${statuses}" th:value="${s}" th:text="${s}"
                  th:selected="${s == todo.status}">TODO</option>
        </select>
      </label>
      <label>우선순위 (1:높음 ~ 3:낮음)
        <input type="number" name="priority" min="1" max="3" th:value="${todo.priority}">
      </label>
      <label>마감일
        <input type="date" name="dueDate" th:value="${todo.dueDate}">
      </label>
      <div class="actions">
        <button type="submit">저장</button>
        <a th:href="@{/todos}">목록</a>
      </div>
    </form>
  </main>
</body>
</html>
